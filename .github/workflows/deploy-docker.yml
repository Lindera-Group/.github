name: Deploy Docker App

on:
  workflow_call:
    inputs:
      app_name:
        description: 'Application name (used for VPS path and domain)'
        required: true
        type: string
      compose_file:
        description: 'Docker Compose file to use'
        default: 'docker-compose.prod.yml'
        type: string
      health_endpoint:
        description: 'Health check endpoint path'
        default: '/health'
        type: string
      health_url:
        description: 'Full health check URL (overrides app_name-based URL)'
        default: ''
        type: string
      build_frontend:
        description: 'Whether to build frontend before deploy'
        default: false
        type: boolean
      frontend_dir:
        description: 'Frontend directory if build_frontend is true'
        default: 'web'
        type: string
    secrets:
      VPS_HOST:
        description: 'VPS IP address'
        required: true
      VPS_SSH_KEY:
        description: 'SSH private key for VPS'
        required: true
      VPS_KNOWN_HOSTS:
        description: 'SSH known hosts entry'
        required: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          echo "${{ secrets.VPS_KNOWN_HOSTS }}" >> ~/.ssh/known_hosts

      - name: Setup Node.js
        if: ${{ inputs.build_frontend }}
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: '${{ inputs.frontend_dir }}/package-lock.json'

      - name: Build frontend
        if: ${{ inputs.build_frontend }}
        run: |
          cd ${{ inputs.frontend_dir }}
          npm ci
          npm run build

      - name: Deploy to VPS
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          APP_NAME: ${{ inputs.app_name }}
          COMPOSE_FILE: ${{ inputs.compose_file }}
        run: |
          rsync -avz --delete \
            --exclude='.git' \
            --exclude='node_modules' \
            --exclude='venv' \
            --exclude='__pycache__' \
            --exclude='*.pyc' \
            --exclude='.env' \
            --exclude='data' \
            --exclude='backups' \
            ./ root@$VPS_HOST:/opt/$APP_NAME/

          ssh root@$VPS_HOST "cd /opt/$APP_NAME && \
            docker compose -f $COMPOSE_FILE pull 2>/dev/null || true && \
            docker compose -f $COMPOSE_FILE up -d --build"

      - name: Verify deployment
        env:
          APP_NAME: ${{ inputs.app_name }}
          HEALTH_ENDPOINT: ${{ inputs.health_endpoint }}
          HEALTH_URL: ${{ inputs.health_url }}
        run: |
          sleep 15
          URL="${HEALTH_URL:-https://$APP_NAME.linderagroup.com$HEALTH_ENDPOINT}"
          HTTP_CODE=$(curl -sf -o /dev/null -w "%{http_code}" "$URL" || echo "000")
          if [ "$HTTP_CODE" = "200" ]; then
            echo "✓ Health check passed (HTTP $HTTP_CODE)"
          else
            echo "⚠ Health check returned HTTP $HTTP_CODE"
          fi
